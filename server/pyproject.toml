[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicpilot"
version = "0.1.0"
description = "Safe AI Patient-Appointment Scheduling Agent with Closed-Loop Evaluation"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*UnionGenericAlias.*:DeprecationWarning",
]

